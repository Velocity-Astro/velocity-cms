<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!--velocity-cms-->
    <title>Editor</title>
    <!--
      What is seen from the first byte of the page: the Velocity mark in the middle, its facets arriving
      in grey and taking their colour, on a clearing in the grid, as LoadingMark draws it. It stays over the
      editor until its first screen is ready (src/lib/boot.ts), so it is one animation to the end, then fades.
    -->
    <style>
      .cms-boot {
        position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
        --boot-bg: var(--background, #fff); --boot-line: var(--border, #e5e5e5);
        background-color: var(--boot-bg);
        background-image: radial-gradient(closest-side, transparent 30%, var(--boot-bg) 100%), linear-gradient(to bottom, var(--boot-line) 1px, transparent 1px), linear-gradient(to right, var(--boot-line) 1px, transparent 1px);
        background-size: 100% 100%, 1.5rem 1.5rem, 1.5rem 1.5rem; background-position: center;
        transition: opacity 300ms ease;
      }
      .cms-boot p { margin: 0; font: 500 0.875rem/1.25rem var(--font-ui, system-ui, sans-serif); color: var(--foreground-subtle, #737373); }
      .cms-boot[data-ending="true"] { opacity: 0; pointer-events: none; }
      .cms-boot svg { width: 4rem; height: auto; overflow: visible; }
      .cms-boot .grey { fill: var(--border, #e5e5e5); }
      .cms-boot .top { fill: var(--brand-fill, #ee4000); }
      .cms-boot .body { fill: var(--foreground, #171717); }
      .cms-boot g { transform-box: fill-box; animation: cms-boot-arrive 2800ms cubic-bezier(0.16, 1, 0.3, 1) infinite backwards; }
      .cms-boot .colour { animation: cms-boot-colour 2800ms cubic-bezier(0.2, 0, 0, 1) infinite backwards; }
      .cms-boot .p1 { --x: 0px; --y: -18px; }
      .cms-boot .p2, .cms-boot .p2 .colour { --x: -18px; --y: 10px; animation-delay: 140ms; }
      .cms-boot .p3, .cms-boot .p3 .colour { --x: 18px; --y: 10px; animation-delay: 280ms; }
      @keyframes cms-boot-arrive {
        0% { opacity: 0; transform: translate(var(--x), var(--y)); }
        22%, 82% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 0; transform: translate(0, 0); }
      }
      @keyframes cms-boot-colour { 0%, 30% { opacity: 0; } 46%, 100% { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        .cms-boot { --boot-bg: var(--gray-950, #0a0a0a); --boot-line: var(--gray-800, #262626); }
        .cms-boot p { color: oklch(60% 0 0); }
        .cms-boot .grey { fill: var(--gray-800, #262626); }
        .cms-boot .body { fill: var(--gray-50, #fafafa); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cms-boot g, .cms-boot .colour { animation: none; }
        .cms-boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="cms-boot" class="cms-boot" aria-hidden="true">
      <svg viewBox="0 0 90 101">
        <g class="p1"><path class="grey" d="M35.1288 23.8398L45.1667 49.4151L56.2482 23.8398H87.1082C86.5647 23.3764 85.9776 22.9637 85.3616 22.5944L48.6165 0.704798C46.377 -0.0699896 43.4273 -0.439281 41.2675 0.842377L3.36286 23.3692C3.13819 23.5067 2.92801 23.666 2.72508 23.8326H35.1288V23.8398Z" /><path class="colour top" d="M35.1288 23.8398L45.1667 49.4151L56.2482 23.8398H87.1082C86.5647 23.3764 85.9776 22.9637 85.3616 22.5944L48.6165 0.704798C46.377 -0.0699896 43.4273 -0.439281 41.2675 0.842377L3.36286 23.3692C3.13819 23.5067 2.92801 23.666 2.72508 23.8326H35.1288V23.8398Z" /></g>
        <g class="p2"><path class="grey" d="M0.144951 28.8578C0.079723 29.2851 0.0434853 29.7123 0.0434853 30.1323L0 72.036C0 76.1778 1.95684 78.3936 5.26172 80.3631L39.4919 100.703L0.144951 28.8578Z" /><path class="colour body" d="M0.144951 28.8578C0.079723 29.2851 0.0434853 29.7123 0.0434853 30.1323L0 72.036C0 76.1778 1.95684 78.3936 5.26172 80.3631L39.4919 100.703L0.144951 28.8578Z" /></g>
        <g class="p3"><path class="grey" d="M89.9203 28.7058L50.0588 101L86.6661 79.1539C88.7027 77.9374 90 75.0265 90 72.6442L89.9783 29.6037C89.9783 29.2923 89.9493 28.9954 89.913 28.6985L89.9203 28.7058Z" /><path class="colour body" d="M89.9203 28.7058L50.0588 101L86.6661 79.1539C88.7027 77.9374 90 75.0265 90 72.6442L89.9783 29.6037C89.9783 29.2923 89.9493 28.9954 89.913 28.6985L89.9203 28.7058Z" /></g>
      </svg>
      <p>Opening the editor</p>
    </div>
    <div id="root"></div>
    <script type="module" src="../src/standalone/main.tsx"></script>
  </body>
</html>
