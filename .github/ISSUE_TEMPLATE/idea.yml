name: Idea
description: A feature, or a change to how something works
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, before any solution. Who has it, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: surface
    attributes:
      label: Does it change a promise?
      options:
        - label: It changes the plugin API or what a template calls
