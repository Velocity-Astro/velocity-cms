name: Release

# Publishes every package to npm at the version in its package.json, and makes the GitHub
# Release for it from that version's section of CHANGELOG.md.
#
# It runs by itself when the packages' version changes on main, which is what merging the
# "Release <version>" pull request does (release-pr.yml keeps that pull request). A push that
# leaves the version as npm already has it does nothing.
#
# By hand it starts as a rehearsal: nothing is published unless "publish" is ticked.
#
# A version that is already on npm is skipped, so a run that stopped halfway can be run again.
#
# Nothing here holds a key to npm. Each package names this workflow as its trusted publisher on
# npmjs.com (Settings, Trusted Publisher), allowed to stage only: npm keeps what a run sends
# under Staged Packages until an owner approves it there, and only then is it public.
on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']
  workflow_dispatch:
    inputs:
      publish:
        description: Send it to npm for real. Left off, it only rehearses.
        type: boolean
        default: false
      tag:
        description: The npm tag people install by. "latest" is what a plain install gets.
        type: string
        default: latest

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Makes the tag and the GitHub Release.
  contents: write
  # How npm knows a run is this workflow: a short-lived proof from GitHub, in place of a token.
  id-token: write

jobs:
  release:
    name: Stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main. This run is on $GITHUB_REF_NAME."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check every package has the same version, and the changelog names it
        run: |
          versions=$(for file in packages/*/package.json; do node -p "const p = require('./$file'); p.private ? '' : p.version"; done | sort -u | sed '/^$/d')
          if [ "$(echo "$versions" | wc -l)" != 1 ]; then
            echo "::error::The packages do not share one version: $(echo $versions). Run node scripts/version.mjs <version>."
            exit 1
          fi
          if ! grep -q "^## $versions\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $versions."
            exit 1
          fi
          echo "VERSION=$versions" >> "$GITHUB_ENV"

      - name: On a push, go on only for a version npm does not have
        id: due
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(npm view "@velocity-astro/cms-core@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$VERSION is already on npm: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.due.outputs.go
        run: pnpm validate
      - if: steps.due.outputs.go
        run: pnpm --filter velocity-cms-starter check

      # Staging needs npm 11.15 or newer, which is newer than the one Node comes with.
      - if: steps.due.outputs.go
        run: npm install --global npm@^11.15.0

      - name: Rehearse
        if: ${{ steps.due.outputs.go && github.event_name != 'push' && !inputs.publish }}
        run: node scripts/publish.mjs --tag "$TAG" --dry-run
        env:
          TAG: ${{ inputs.tag || 'latest' }}

      - name: Stage on npm
        if: ${{ steps.due.outputs.go && (github.event_name == 'push' || inputs.publish) }}
        run: |
          node scripts/publish.mjs --tag "$TAG"
          echo "Staged $VERSION on npm under the \"$TAG\" tag. It is public once an owner approves it on npmjs.com, under Staged Packages." >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag || 'latest' }}

      - name: Make the GitHub Release
        if: ${{ steps.due.outputs.go && (github.event_name == 'push' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION is already there."
            exit 0
          fi
          node scripts/next-release.mjs --notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # The tag is pushed with git and the Release made for it: asked to tag a commit itself,
          # GitHub refuses a workflow's own token.
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
          fi
          gh release create "v$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $pre
