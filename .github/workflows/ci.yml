name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release pull request is pushed by a workflow, which starts no other workflow by itself:
  # release-pr.yml asks for this one on its branch, so the checks main requires are there.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      # The starter, from an empty database: seeded, built, started and asked for every page.
      - run: pnpm --filter velocity-cms-starter check
      # Two sites from that one copy: each reads only its own database, and an unknown host has no site.
      - run: pnpm --filter velocity-cms-starter check:hosted
      # The same site as a Cloudflare Worker on a D1 database, in the Workers runtime. A line that reads a path
      # from disk as a module loads takes every address down there, and no test in Node would notice.
      - run: pnpm --filter velocity-cms-starter check:workers

  stories:
    name: Design system stories (accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @velocity-astro/cms-ui exec playwright install --with-deps chromium
      - run: pnpm --filter @velocity-astro/cms-ui check:stories
