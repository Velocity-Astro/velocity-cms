name: Demo sign-in link

# Prints a link that signs one person in to one of the CMS demos, which send no email themselves.
# The first run creates the site's owner. The link works once, for 10 minutes, and is shown in
# this run's log, which only people with access to this repository can read.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Which demo to sign in to
        type: choice
        options: [real-estate, restaurant, law-firm]
        default: real-estate
      email:
        description: Your email address
        required: true
      name:
        description: Your name (used the first time only)
        required: false
        default: Site owner

permissions:
  contents: read

jobs:
  link:
    name: Sign-in link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EMAIL: ${{ inputs.email }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the demo's address, database and secret
        env:
          DEMO: ${{ inputs.demo }}
          FIXED_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          FIXED_DATABASE_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BASE_SECRET: ${{ secrets.VELOCITY_CMS_SECRET }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: |
          bash .github/scripts/demo-site.sh
          # Links are made for the demo's own address.
          echo "VELOCITY_CMS_ORIGIN=$(grep '^SITE_URL=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b
      - name: Sign-in link
        run: |
          cli=packages/cms-astro/bin/velocity-cms.mjs
          node "$cli" link "$EMAIL" || node "$cli" owner "$EMAIL" "$NAME"
