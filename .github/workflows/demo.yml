name: Demo

# Deploys each Premium template that has a demo on the CMS (real estate, restaurant) to its own
# Vercel project, which answers at the template's demo domain (realestate.deployvelocity.com,
# restaurant.deployvelocity.com). A template's static demo is another project and is not touched.
#
# The demos are listed in .github/scripts/demo-site.sh, with the project and database of each.
# Real estate has its database in two secrets. A newer demo needs none of its own: the workflow
# finds its database on Turso by name, makes it the first time, and makes a token for each run,
# all with one secret, TURSO_API_TOKEN (and the variables TURSO_ORGANIZATION and TURSO_GROUP,
# which default to "velocity" and "default").
#
# Anyone may sign in to a demo as an editor (the "Try the editor" link in its bar), so every
# night each is put back as it was: everything but its owners goes, and the sample content is
# brought in again. It sends no email and takes no uploads, because an editor chooses who a form
# tells and what is uploaded, and neither should be open to the whole internet.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: Which demo to deploy
        type: choice
        options: [all, real-estate, restaurant]
        default: all
      reset:
        description: Erase the demo first (everything but its owners) and bring the sample content back
        type: boolean
        default: false
      templates_ref:
        description: Branch of velocity-templates to build from (to try a change before it is merged)
        default: main
      owner:
        description: Add an owner, by email address (signs in at /admin; the link is in the Vercel project's logs)
        default: ''
      owner_name:
        description: The owner's name (left empty, the address before the @)
        default: ''
  push:
    branches: [main]
    paths: ['packages/**', '.github/workflows/demo.yml', '.github/scripts/demo-site.sh']
  schedule:
    # Every night, a little after 3 AM US Central.
    - cron: '23 8 * * *'

# One at a time and never cut short: a run stopped between the reset and the import would leave
# the demo empty.
concurrency:
  group: demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  demo:
    name: ${{ matrix.demo }} on the CMS
    # One demo that cannot be deployed never holds back another.
    strategy:
      fail-fast: false
      matrix:
        # Every demo, or the one a run by hand asked for.
        demo: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.demo == 'all') && '["real-estate", "restaurant"]' || format('["{0}"]', inputs.demo)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VELOCITY_REF: v2.7.3
      DEMO: ${{ matrix.demo }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      TEMPLATES_REPO_TOKEN: ${{ secrets.TEMPLATES_REPO_TOKEN }}
      # The person every visitor is signed in as, an editor. No email is ever sent to it.
      CMS_DEMO_VISITOR: ${{ vars.CMS_DEMO_VISITOR || 'editor@demo.invalid' }}
      ASKED_TO_RESET: ${{ github.event_name == 'schedule' || inputs.reset == true }}
    steps:
      - name: Check that every secret is there
        run: |
          missing=""
          for name in VERCEL_TOKEN TEMPLATES_REPO_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add the matching secrets under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: cms
      - uses: actions/checkout@v4
        with:
          repository: velocity-astro/velocity-templates
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          ref: ${{ inputs.templates_ref || 'main' }}
          path: templates

      - name: Find the demo's project, database and secret
        env:
          DEMO_MAKE_DATABASE: 'true'
          FIXED_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          FIXED_DATABASE_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BASE_SECRET: ${{ secrets.VELOCITY_CMS_SECRET }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: |
          bash cms/.github/scripts/demo-site.sh
          # A database made just now has nobody in it: the reset makes the person visitors share.
          if [ "$ASKED_TO_RESET" = "true" ] || [ "$(grep '^DATABASE_MADE=' "$GITHUB_ENV" | tail -1)" = "DATABASE_MADE=true" ]; then
            echo "RESET=true" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cms/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the CMS
        working-directory: cms
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble the template
        working-directory: templates
        run: |
          mkdir velocity
          curl -fsSL "https://github.com/southwellmedia/velocity/archive/refs/tags/$VELOCITY_REF.tar.gz" \
            | tar xz --strip-components=1 -C velocity
          node scripts/assemble.mjs "$DEMO" --velocity=velocity --ref="$VELOCITY_REF" --demo
          cd "build/$DEMO" && pnpm install --no-frozen-lockfile

      - name: Find or create the Vercel project
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          teams=$(curl -fsS -H "$auth" "$api/v2/teams")
          team="$VERCEL_SCOPE"
          if [ -z "$team" ]; then
            if [ "$(echo "$teams" | jq '.teams | length')" != 1 ]; then
              echo "Teams: $(echo "$teams" | jq -r '[.teams[].slug] | join(", ")')"
              echo "::error::Set the VERCEL_SCOPE variable to one of the teams above"
              exit 1
            fi
            team=$(echo "$teams" | jq -r '.teams[0].slug')
          fi
          org=$(echo "$teams" | jq -r --arg team "$team" '.teams[] | select(.slug == $team) | .id')
          project=$(curl -sS -H "$auth" "$api/v9/projects/$VERCEL_PROJECT?slug=$team" | jq -r '.id // empty')
          if [ -z "$project" ]; then
            project=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$VERCEL_PROJECT\",\"framework\":\"astro\"}" \
              "$api/v11/projects?slug=$team" | jq -r '.id')
          fi
          # What the running site reads. Sent again on every deploy, so a changed secret takes effect.
          for name in VELOCITY_CMS_DATABASE_URL VELOCITY_CMS_DATABASE_TOKEN VELOCITY_CMS_SECRET; do
            jq -n --arg key "$name" --arg value "${!name}" '{key: $key, value: $value, type: "encrypted", target: ["production"]}' \
              | curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d @- \
                "$api/v10/projects/$project/env?slug=$team&upsert=true"
          done
          # The host calls /api/cms/schedule once a day with this, to publish what is due.
          export CRON_SECRET="$VELOCITY_CMS_SECRET"
          for name in CRON_SECRET CMS_DEMO_VISITOR; do
            jq -n --arg key "$name" --arg value "${!name}" '{key: $key, value: $value, type: "encrypted", target: ["production"]}' \
              | curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d @- \
                "$api/v10/projects/$project/env?slug=$team&upsert=true"
          done
          # No email and no uploads on a demo anyone can edit: what an earlier deploy set is removed.
          curl -fsS -H "$auth" "$api/v9/projects/$project/env?slug=$team" \
            | jq -r '.envs[] | select(.key | test("^VELOCITY_CMS_(S3_|RESEND_API_KEY$|EMAIL_FROM$)")) | .id' \
            | while read -r id; do
                curl -fsS -o /dev/null -X DELETE -H "$auth" "$api/v9/projects/$project/env/$id?slug=$team"
              done
          echo "VERCEL_ORG_ID=$org" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$project" >> "$GITHUB_ENV"

      - name: Put the demo back as it was
        if: env.RESET == 'true'
        working-directory: templates
        env:
          VELOCITY_CMS_DIR: ${{ github.workspace }}/cms
        run: node "cms/$DEMO/reset.mjs" --yes

      - name: Import the content and convert the pages
        working-directory: templates/build/${{ matrix.demo }}
        # The template's wiring to the CMS is kept with the template, in the private repository.
        env:
          VELOCITY_CMS_DIR: ${{ github.workspace }}/cms
        run: node "$GITHUB_WORKSPACE/templates/cms/$DEMO/prepare.mjs" .

      - name: Add an owner
        if: inputs.owner != ''
        # The address is read from the run's event and masked by the script, never put in this
        # step's environment, which the log prints. No sign-in link is printed: the logs are public.
        run: node "$GITHUB_WORKSPACE/cms/.github/scripts/demo-owner.mjs"

      - name: Deploy to Vercel
        working-directory: templates/build/${{ matrix.demo }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee deploy.log
          echo "Deployed: $(tail -1 deploy.log) (site address: $SITE_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the editor answers at the site's address
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$SITE_URL/api/cms/session" | jq -e 'has("user")' > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::$SITE_URL/api/cms/session did not answer. Check that the domain is on the project $VERCEL_PROJECT in Vercel (Settings, Domains), then run again."
          exit 1

      - name: Check a visitor is let in as the shared editor
        if: env.RESET == 'true'
        run: |
          # The link itself is never printed: it signs someone in. A new deploy can take a few
          # seconds to answer at the site's address, so this asks more than once.
          for attempt in 1 2 3 4 5 6; do
            curl -sS -o /dev/null -D headers.txt -X POST -H "Origin: $SITE_URL" "$SITE_URL/demo/sign-in" || true
            if grep -i -q '^location: .*/api/cms/auth/' headers.txt; then exit 0; fi
            sleep 10
          done
          grep -i -v '^location:' headers.txt | grep -i -E '^(HTTP/|x-vercel-|x-matched-path|cache-control|content-type|server)' || true
          if grep -i -q '^location:' headers.txt; then echo "It sent the visitor somewhere other than a sign-in link (the shared person may be missing)."; fi
          if curl -sS "$SITE_URL/demo/" | grep -q 'action="/demo/sign-in"'; then
            echo "The page at /demo/ offers the editor, so the site knows its visitor."
          else
            echo "The page at /demo/ does not offer the editor, so the site does not know its visitor (CMS_DEMO_VISITOR)."
          fi
          echo "::error::$SITE_URL/demo/sign-in did not send a visitor on to sign in. The lines above say how it answered."
          exit 1

      - name: Check the public pages answer
        run: |
          failed=0
          for path in $DEMO_PAGES; do
            status=$(curl -sS -o body.html -D headers.txt -w '%{http_code}' "$SITE_URL$path" || echo 000)
            echo "$path -> $status ($(wc -c < body.html) bytes)"
            if [ "$status" != "200" ]; then
              failed=1
              grep -i -E '^(x-vercel-|x-matched-path|cache-control|age|server|content-type|location)' headers.txt || true
              head -c 600 body.html || true
              echo
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::A public page of $SITE_URL did not answer 200. The lines above say which, with its headers."
            exit 1
          fi
