name: Demo

# Deploys the real estate template, running on the CMS, to its own Vercel project.
# The template's public demo is another project and is not touched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/**', '.github/workflows/demo.yml']

concurrency:
  group: demo
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-estate:
    name: Real estate on the CMS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VELOCITY_REF: v2.7.3
      VERCEL_PROJECT: velocity-cms-real-estate-demo
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      TEMPLATES_REPO_TOKEN: ${{ secrets.TEMPLATES_REPO_TOKEN }}
      VELOCITY_CMS_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      VELOCITY_CMS_DATABASE_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      VELOCITY_CMS_SECRET: ${{ secrets.VELOCITY_CMS_SECRET }}
      # Where uploaded photos are kept: a private Cloudflare R2 bucket. Optional; without all
      # four the demo deploys as before and the editor offers no upload.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Sends invitations and sign-in links by email through Resend. Optional; without both,
      # the site prints them to its log and the "Demo sign-in link" workflow is the way in.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CMS_EMAIL_FROM: ${{ secrets.CMS_EMAIL_FROM }}
    steps:
      - name: Check that every secret is there
        run: |
          missing=""
          for name in VERCEL_TOKEN TEMPLATES_REPO_TOKEN VELOCITY_CMS_DATABASE_URL VELOCITY_CMS_DATABASE_TOKEN VELOCITY_CMS_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add the matching secrets under Settings, Secrets and variables, Actions."
            exit 1
          fi
          if [ "${#VELOCITY_CMS_SECRET}" -lt 32 ]; then
            echo "::error::VELOCITY_CMS_SECRET must be at least 32 characters."
            exit 1
          fi
          given=0
          for name in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -z "${!name}" ] || given=$((given + 1))
          done
          if [ "$given" = 4 ]; then
            echo "UPLOADS=on" >> "$GITHUB_ENV"
          elif [ "$given" = 0 ]; then
            echo "UPLOADS=off" >> "$GITHUB_ENV"
            echo "::notice::No R2 secrets, so the editor will offer no photo upload."
          else
            echo "::error::Photo uploads need all four of R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY. $given of them are set."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: cms
      - uses: actions/checkout@v4
        with:
          repository: velocity-astro/velocity-templates
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          path: templates
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cms/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the CMS
        working-directory: cms
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check the bucket of uploads takes a file and gives it back
        if: env.UPLOADS == 'on'
        working-directory: cms
        run: |
          node --input-type=module -e "
          import { S3MediaStore } from './packages/cms-astro/dist/media-store.js';
          const store = new S3MediaStore({
            endpoint: 'https://' + process.env.R2_ACCOUNT_ID + '.r2.cloudflarestorage.com',
            bucket: process.env.R2_BUCKET,
            accessKeyId: process.env.R2_ACCESS_KEY_ID,
            secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
          });
          const key = 'deploy-check-' + process.env.GITHUB_RUN_ID + '.png';
          const bytes = Uint8Array.from([137, 80, 78, 71, 13, 10, 26, 10]);
          await store.put(key, { bytes, contentType: 'image/png' });
          const back = await store.get(key);
          await store.remove(key);
          if (!back || back.bytes.length !== bytes.length || back.contentType !== 'image/png') throw new Error('The bucket did not give the file back as it was kept.');
          if ((await store.get(key)) !== null) throw new Error('The bucket still has a file that was removed.');
          console.log('The bucket kept a file, gave it back and removed it.');
          "

      - name: Assemble the template
        working-directory: templates
        run: |
          mkdir velocity
          curl -fsSL "https://github.com/southwellmedia/velocity/archive/refs/tags/$VELOCITY_REF.tar.gz" \
            | tar xz --strip-components=1 -C velocity
          node scripts/assemble.mjs real-estate --velocity=velocity --ref="$VELOCITY_REF" --demo
          cd build/real-estate && pnpm install --no-frozen-lockfile

      - name: Find or create the Vercel project
        run: |
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          teams=$(curl -fsS -H "$auth" "$api/v2/teams")
          team="$VERCEL_SCOPE"
          if [ -z "$team" ]; then
            if [ "$(echo "$teams" | jq '.teams | length')" != 1 ]; then
              echo "Teams: $(echo "$teams" | jq -r '[.teams[].slug] | join(", ")')"
              echo "::error::Set the VERCEL_SCOPE variable to one of the teams above"
              exit 1
            fi
            team=$(echo "$teams" | jq -r '.teams[0].slug')
          fi
          org=$(echo "$teams" | jq -r --arg team "$team" '.teams[] | select(.slug == $team) | .id')
          project=$(curl -sS -H "$auth" "$api/v9/projects/$VERCEL_PROJECT?slug=$team" | jq -r '.id // empty')
          if [ -z "$project" ]; then
            project=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$VERCEL_PROJECT\",\"framework\":\"astro\"}" \
              "$api/v11/projects?slug=$team" | jq -r '.id')
          fi
          # What the running site reads. Sent again on every deploy, so a changed secret takes effect.
          for name in VELOCITY_CMS_DATABASE_URL VELOCITY_CMS_DATABASE_TOKEN VELOCITY_CMS_SECRET; do
            jq -n --arg key "$name" --arg value "${!name}" '{key: $key, value: $value, type: "encrypted", target: ["production"]}' \
              | curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d @- \
                "$api/v10/projects/$project/env?slug=$team&upsert=true"
          done
          if [ "$UPLOADS" = on ]; then
            export VELOCITY_CMS_S3_ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
            export VELOCITY_CMS_S3_BUCKET="$R2_BUCKET"
            export VELOCITY_CMS_S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export VELOCITY_CMS_S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            for name in VELOCITY_CMS_S3_ENDPOINT VELOCITY_CMS_S3_BUCKET VELOCITY_CMS_S3_ACCESS_KEY_ID VELOCITY_CMS_S3_SECRET_ACCESS_KEY; do
              jq -n --arg key "$name" --arg value "${!name}" '{key: $key, value: $value, type: "encrypted", target: ["production"]}' \
                | curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d @- \
                  "$api/v10/projects/$project/env?slug=$team&upsert=true"
            done
          fi
          if [ -n "$RESEND_API_KEY" ] && [ -n "$CMS_EMAIL_FROM" ]; then
            export VELOCITY_CMS_RESEND_API_KEY="$RESEND_API_KEY"
            export VELOCITY_CMS_EMAIL_FROM="$CMS_EMAIL_FROM"
            for name in VELOCITY_CMS_RESEND_API_KEY VELOCITY_CMS_EMAIL_FROM; do
              jq -n --arg key "$name" --arg value "${!name}" '{key: $key, value: $value, type: "encrypted", target: ["production"]}' \
                | curl -fsS -o /dev/null -X POST -H "$auth" -H 'Content-Type: application/json' -d @- \
                  "$api/v10/projects/$project/env?slug=$team&upsert=true"
            done
            echo "EMAIL: on (Resend)"
          else
            echo "EMAIL: off (links are printed to the site's log)"
          fi
          # The project's own address, which sign-in links and passkeys are made for.
          site="${{ vars.CMS_DEMO_URL }}"
          [ -n "$site" ] || site="https://$VERCEL_PROJECT.vercel.app"
          echo "SITE_URL=$site" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$org" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$project" >> "$GITHUB_ENV"

      - name: Import the content and convert the pages
        working-directory: templates/build/real-estate
        # The template's wiring to the CMS is kept with the template, in the private repository.
        env:
          VELOCITY_CMS_DIR: ${{ github.workspace }}/cms
        run: node "$GITHUB_WORKSPACE/templates/cms/real-estate/prepare.mjs" .

      - name: Deploy to Vercel
        working-directory: templates/build/real-estate
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee deploy.log
          echo "Deployed: $(tail -1 deploy.log) (site address: $SITE_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the editor answers at the site's address
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$SITE_URL/api/cms/session" | jq -e 'has("user")' > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::$SITE_URL/api/cms/session did not answer. If the project has another address, set the CMS_DEMO_URL variable to it and run again."
          exit 1

      - name: Check the site can read the bucket of uploads
        if: env.UPLOADS == 'on'
        run: |
          # A photo that does not exist: 404 means the bucket was asked and said so. Anything
          # else means the site could not read the bucket (a wrong key, name or account id).
          status=$(curl -sS -o body.txt -w '%{http_code}' "$SITE_URL/media/not-uploaded-$GITHUB_RUN_ID.jpg" || echo 000)
          if [ "$status" != "404" ]; then
            echo "::error::$SITE_URL could not read the R2 bucket (answered $status). Check the four R2 secrets, and that the token may read and write objects in that bucket."
            exit 1
          fi

      - name: Check the public pages answer
        run: |
          failed=0
          for path in / /es/ /homes-for-sale/ /listings/lakeshore-farmhouse/ /agents/ /why-list-with-us/; do
            status=$(curl -sS -o body.html -D headers.txt -w '%{http_code}' "$SITE_URL$path" || echo 000)
            echo "$path -> $status ($(wc -c < body.html) bytes)"
            if [ "$status" != "200" ]; then
              failed=1
              grep -i -E '^(x-vercel-|x-matched-path|cache-control|age|server|content-type|location)' headers.txt || true
              head -c 600 body.html || true
              echo
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::A public page of $SITE_URL did not answer 200. The lines above say which, with its headers."
            exit 1
          fi
